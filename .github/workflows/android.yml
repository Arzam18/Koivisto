name: Koivisto Android Build

on:
  workflow_dispatch:

jobs:
  build:
    name: Build for Android (ARM64)
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up Android NDK
      uses: nttld/setup-ndk@v1
      id: setup-ndk
      with:
        ndk-version: r26b

    - name: Configure CMake
      run: |
        mkdir build
        cd build

        cmake .. \
          -DCMAKE_TOOLCHAIN_FILE=${{ steps.setup-ndk.outputs.ndk-path }}/build/cmake/android.toolchain.cmake \
          -DANDROID_ABI=arm64-v8a \
          -DANDROID_PLATFORM=android-29 \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_ANDROID_STL_TYPE=c++_static

    - name: Build Koivisto
      run: |
        cmake --build build --config Release -j $(nproc)

    - name: Verify Binary
      run: |
        ls -lh build/Koivisto
        file build/Koivisto

    - name: Check for libc++ dependency
      run: |
        echo "Checking dynamic dependencies..."
        readelf -d build/Koivisto || true

        echo
        echo "Checking for libc++_shared.so:"
        if readelf -d build/Koivisto 2>/dev/null | grep -q "libc++_shared.so"; then
          echo "ERROR: Koivisto still depends on libc++_shared.so"
          exit 1
        else
          echo "OK: No libc++_shared.so dependency found."
        fi

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Koivisto-Android-arm64
        path: build/Koivisto
        retention-days: 7
